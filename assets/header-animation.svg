<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180">
  <defs>

    <!-- Stealth Gray Gradient - animated -->
    <linearGradient id="stealthGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#374151">
        <animate attributeName="stop-color" values="#374151;#4b5563;#6b7280;#374151" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#4b5563">
        <animate attributeName="stop-color" values="#4b5563;#6b7280;#374151;#4b5563" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#6b7280">
        <animate attributeName="stop-color" values="#6b7280;#374151;#4b5563;#6b7280" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Subtle glow for name text -->
    <filter id="textGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#4b5563" flood-opacity="0.4"/>
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.5" opacity="0.25"/>
    </pattern>

  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0d1117"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Accent Line Top -->
  <rect x="0" y="0" width="900" height="2" fill="url(#stealthGradient)"/>

  <!-- Main Name -->
  <g filter="url(#textGlow)">
    <text
      x="450" y="74"
      text-anchor="middle"
      font-family="'Segoe UI', 'SF Pro Display', -apple-system, sans-serif"
      font-size="52"
      font-weight="700"
      fill="url(#stealthGradient)"
      letter-spacing="6">
      FARHAN
    </text>
  </g>

  <!-- Title / Subtitle -->
  <text
    x="450" y="112"
    text-anchor="middle"
    font-family="'Segoe UI', 'SF Pro Display', -apple-system, sans-serif"
    font-size="15"
    font-weight="500"
    fill="#9ca3af"
    letter-spacing="4">
    AI FULL-STACK ENGINEER  •  NODE.JS  •  PYTHON  •  NEXT.JS
  </text>

  <!-- Decorative Lines -->
  <g opacity="0.5">
    <line x1="120" y1="138" x2="370" y2="138" stroke="url(#stealthGradient)" stroke-width="1">
      <animate attributeName="x2" values="120;370" dur="1.2s" fill="freeze"/>
    </line>
    <line x1="530" y1="138" x2="780" y2="138" stroke="url(#stealthGradient)" stroke-width="1">
      <animate attributeName="x1" values="780;530" dur="1.2s" fill="freeze"/>
    </line>
  </g>

  <!-- Center Rotating Diamond -->
  <polygon points="450,131 459,143 450,155 441,143" fill="url(#stealthGradient)" opacity="0.7">
    <animateTransform attributeName="transform" type="rotate" from="0 450 143" to="360 450 143" dur="12s" repeatCount="indefinite"/>
  </polygon>

  <!-- Accent Line Bottom -->
  <rect x="0" y="178" width="900" height="2" fill="url(#stealthGradient)"/>

</svg>
