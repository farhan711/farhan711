<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="650" height="320" viewBox="0 0 650 320">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b26"/>
      <stop offset="100%" style="stop-color:#13141a"/>
    </linearGradient>
  </defs>
  
  <!-- Terminal Window -->
  <rect x="0" y="0" width="650" height="320" rx="12" ry="12" fill="url(#termBg)" stroke="#2d2d3a" stroke-width="1"/>
  
  <!-- Terminal Title Bar -->
  <rect x="0" y="0" width="650" height="36" rx="12" ry="12" fill="#1e1f29"/>
  <rect x="0" y="24" width="650" height="12" fill="#1e1f29"/>
  
  <!-- Window Controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27ca40"/>
  
  <!-- Terminal Title -->
  <text x="325" y="23" text-anchor="middle" font-family="'SF Mono', 'Consolas', monospace" font-size="12" fill="#6b7280">
    farhan@dev — zsh
  </text>
  
  <!-- Terminal Content -->
  <g font-family="'SF Mono', 'JetBrains Mono', 'Consolas', monospace" font-size="13">
    <!-- Command -->
    <text x="20" y="65" fill="#27ca40">❯</text>
    <text x="40" y="65" fill="#e5e7eb">cat profile.json</text>
    
    <!-- JSON Output -->
    <text x="20" y="95" fill="#fbbf24">{</text>
    
    <text x="35" y="118" fill="#a78bfa">"name"</text>
    <text x="90" y="118" fill="#9ca3af">:</text>
    <text x="100" y="118" fill="#34d399">"Farhan"</text>
    <text x="185" y="118" fill="#9ca3af">,</text>
    
    <text x="35" y="141" fill="#a78bfa">"role"</text>
    <text x="85" y="141" fill="#9ca3af">:</text>
    <text x="95" y="141" fill="#34d399">"AI Full-Stack Engineer"</text>
    <text x="310" y="141" fill="#9ca3af">,</text>

    <text x="35" y="164" fill="#a78bfa">"stack"</text>
    <text x="92" y="164" fill="#9ca3af">:</text>
    <text x="102" y="164" fill="#34d399">"Node.js + Python + Next.js"</text>
    <text x="348" y="164" fill="#9ca3af">,</text>

    <text x="35" y="187" fill="#a78bfa">"ai_ml"</text>
    <text x="90" y="187" fill="#9ca3af">:</text>
    <text x="100" y="187" fill="#34d399">"RAG · LLMs · GPT-4 · LangChain"</text>
    <text x="370" y="187" fill="#9ca3af">,</text>
    
    <text x="35" y="210" fill="#a78bfa">"shopify"</text>
    <text x="105" y="210" fill="#9ca3af">:</text>
    <text x="115" y="210" fill="#34d399">"Custom Apps · Storefront · Admin API"</text>
    <text x="393" y="210" fill="#9ca3af">,</text>
    
    <text x="35" y="233" fill="#a78bfa">"experience"</text>
    <text x="125" y="233" fill="#9ca3af">:</text>
    <text x="135" y="233" fill="#34d399">"8+ years · Production-grade systems"</text>
    <text x="393" y="233" fill="#9ca3af">,</text>

    <text x="35" y="256" fill="#a78bfa">"goal"</text>
    <text x="80" y="256" fill="#9ca3af">:</text>
    <text x="90" y="256" fill="#34d399">"Ship fast. Scale smart. Build for humans."</text>
    
    <text x="20" y="279" fill="#fbbf24">}</text>
    
    <!-- New Command Line with blinking cursor -->
    <text x="20" y="305" fill="#27ca40">❯</text>
    <rect x="40" y="293" width="10" height="16" fill="#667eea">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
